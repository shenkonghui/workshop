# Model per-token pricing (USD per 1M tokens)
# Source: Devin official — https://docs.devin.ai/desktop/models
# Fetched: 2026-08-21
# Keyed by the `model` column in sessions.db (Devin model_uid).
#
# Dimensions:
#   input       — input tokens (non-cached)
#   cache_read  — cached input tokens (prompt cache hit)
#   cache_write — prompt cache write tokens (0 if not separately billed)
#   output      — output tokens
#   credit_multiplier — Devin enterprise credit multiplier (for reference)

models:
  glm-5-2:
