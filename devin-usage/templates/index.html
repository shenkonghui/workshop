<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devin Usage Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117; --card: #161b22; --border: #30363d;
      --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
      --green: #3fb950; --orange: #d29922; --red: #f85149;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); padding: 24px;
    }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; }

    /* Toolbar */
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
    .range-btn {
      padding: 6px 16px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text-dim); cursor: pointer;
      font-size: 14px; transition: all .15s;
    }
    .range-btn:hover { border-color: var(--accent); color: var(--text); }
    .range-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    #refresh-btn, #lang-btn, #db-apply {
      padding: 6px 16px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--card); color: var(--text);
      cursor: pointer; font-size: 14px; transition: all .15s;
    }
    #refresh-btn:hover { border-color: var(--green); color: var(--green); }
    #refresh-btn:active { transform: scale(.96); }
    #lang-btn:hover { border-color: var(--accent); color: var(--accent); }
    #db-apply:hover { border-color: var(--accent); color: var(--accent); }
    #last-updated { color: var(--text-dim); font-size: 12px; margin-left: 12px; }

    /* Summary cards */
    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px;
    }
    .stat-card .label { color: var(--text-dim); font-size: 12px; margin-bottom: 6px; }
    .stat-card .value { font-size: 22px; font-weight: 600; }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.accent { color: var(--accent); }
    .stat-card .value.orange { color: var(--orange); }

    /* Charts */
    .charts-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;
    }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px;
    }
    .chart-card h3 { font-size: 15px; margin-bottom: 12px; }
    .chart-wrapper { position: relative; height: 280px; }

    /* Table */
    .table-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden;
    }
    .table-card h3 { font-size: 15px; padding: 16px; border-bottom: 1px solid var(--border); }
    .table-scroll { overflow-x: auto; max-height: 500px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { position: sticky; top: 0; background: var(--card); z-index: 1; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--text-dim); font-weight: 500; cursor: pointer; user-select: none; }
    th:hover { color: var(--accent); }
    th.sorted-asc::after { content: " \2191"; color: var(--accent); }
    th.sorted-desc::after { content: " \2193"; color: var(--accent); }
    tbody tr:hover { background: rgba(88,166,255,.06); }
    .td-num { text-align: right; font-variant-numeric: tabular-nums; }
    .model-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      background: rgba(88,166,255,.15); color: var(--accent); font-size: 12px;
    }
    .title-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }

    .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  </style>
</head>
<body>
  <h1>Devin Usage Dashboard</h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="toolbar">
    <button class="range-btn" data-days="1" data-i18n="last_1d"></button>
    <button class="range-btn active" data-days="7" data-i18n="last_7d"></button>
    <button class="range-btn" data-days="30" data-i18n="last_30d"></button>
    <button class="range-btn" data-days="" data-i18n="all_time"></button>
    <span id="last-updated"></span>
    <button id="lang-btn">中文</button>
    <button id="refresh-btn" data-i18n-html="refresh"></button>
  </div>

  <div class="toolbar" style="margin-bottom:16px">
    <label style="color:var(--text-dim);font-size:13px" data-i18n="db_path"></label>
    <input id="db-input" type="text" spellcheck="false"
      style="flex:1;min-width:300px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:13px;font-family:monospace" />
    <button id="db-apply" data-i18n="apply"></button>
    <span id="db-status" style="font-size:12px;margin-left:8px"></span>
  </div>

  <!-- Summary -->
  <div class="summary-grid" id="summary-grid">
    <div class="stat-card"><div class="label" data-i18n="sessions"></div><div class="value" id="s-sessions">—</div></div>
    <div class="stat-card"><div class="label">Agent Messages</div><div class="value" id="s-messages">—</div></div>
    <div class="stat-card"><div class="label">Input Tokens</div><div class="value accent" id="s-input">—</div></div>
    <div class="stat-card"><div class="label">Output Tokens</div><div class="value green" id="s-output">—</div></div>
    <div class="stat-card"><div class="label">Cached Input Tokens</div><div class="value orange" id="s-cached">—</div></div>
    <div class="stat-card"><div class="label">Total Tokens</div><div class="value" id="s-total">—</div></div>
    <div class="stat-card"><div class="label" data-i18n="est_cost"></div><div class="value" style="color:#f0883e" id="s-cost">—</div></div>
  </div>

  <!-- Charts -->
  <div class="charts-grid">
    <div class="chart-card">
      <h3 data-i18n="daily_trend"></h3>
      <div class="chart-wrapper"><canvas id="chart-day"></canvas></div>
    </div>
    <div class="chart-card">
      <h3 data-i18n="by_model"></h3>
      <div class="chart-wrapper"><canvas id="chart-model"></canvas></div>
    </div>
  </div>

  <!-- Trend line chart -->
  <div class="chart-card" style="margin-bottom: 24px;">
    <h3 data-i18n="trend_line"></h3>
    <div class="chart-wrapper" style="height: 320px;"><canvas id="chart-trend"></canvas></div>
  </div>

  <!-- Model pricing table -->
  <div class="table-card" style="margin-bottom: 24px;">
    <h3><span data-i18n="pricing_title"></span>
      <span style="font-size:12px;color:var(--text-dim);font-weight:400" data-i18n="pricing_note"></span>
    </h3>
    <div class="table-scroll">
      <table id="pricing-table">
        <thead>
          <tr>
            <th data-i18n="model"></th>
            <th class="td-num" data-i18n="input_price"></th>
            <th class="td-num" data-i18n="cached_price"></th>
            <th class="td-num" data-i18n="output_price"></th>
            <th class="td-num">Input Tokens</th>
            <th class="td-num">Output Tokens</th>
            <th class="td-num">Cached Tokens</th>
            <th class="td-num" data-i18n="sessions"></th>
            <th class="td-num" data-i18n="est_cost"></th>
          </tr>
        </thead>
        <tbody id="pricing-tbody"></tbody>
        <tfoot>
          <tr style="font-weight:600;border-top:2px solid var(--border)">
            <td data-i18n="total"></td>
            <td colspan="7"></td>
            <td class="td-num" id="pricing-total" style="color:#f0883e">$0.00</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <!-- Session table -->
  <div class="table-card">
    <h3><span data-i18n="session_detail"></span>
      <select id="model-filter" style="margin-left:12px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;vertical-align:middle;">
        <option value="" data-i18n="all_models"></option>
      </select>
      <span id="filter-count" style="font-size:12px;color:var(--text-dim);font-weight:400;margin-left:8px"></span>
    </h3>
    <div class="table-scroll">
      <table id="session-table">
        <thead>
          <tr>
            <th data-key="last_activity_at_str" data-i18n="last_activity"></th>
            <th data-key="title" data-i18n="title"></th>
            <th data-key="model_display" data-i18n="model"></th>
            <th data-key="input_tokens" class="td-num">Input</th>
            <th data-key="output_tokens" class="td-num">Output</th>
            <th data-key="cached_input_tokens" class="td-num">Cached</th>
            <th data-key="cache_rate" class="td-num" data-i18n="cache_rate"></th>
            <th data-key="total_tokens" class="td-num">Total</th>
            <th data-key="estimated_cost" class="td-num" data-i18n="cost_usd"></th>
            <th data-key="agent_messages" class="td-num">Msgs</th>
          </tr>
        </thead>
        <tbody id="session-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ---- i18n ----
    const I18N = {
      en: {
        subtitle: 'Token usage across all Devin CLI sessions, with time-range filtering and multi-dimension aggregation',
        last_1d: 'Last 1 day',
        last_7d: 'Last 7 days',
        last_30d: 'Last 30 days',
        all_time: 'All time',
        refresh: '\u27F3 Refresh',
        sessions: 'Sessions',
        est_cost: 'Est. Cost (USD)',
        daily_trend: 'Daily Trend',
        hourly_trend: 'Hourly Trend',
        by_model: 'By Model',
        trend_line: 'Daily Token Trend (Line)',
        trend_line_hourly: 'Hourly Token Trend (Line)',
        pricing_title: 'Model Pricing & Cost Estimate',
        pricing_note: '(USD / 1M tokens, official public pricing as of 2026-08-20)',
        model: 'Model',
        input_price: 'Input Price',
        cached_price: 'Cached Price',
        output_price: 'Output Price',
        total: 'Total',
        session_detail: 'Session Details',
        all_models: 'All models',
        last_activity: 'Last Activity',
        title: 'Title',
        cache_rate: 'Cache Rate',
        cost_usd: 'Cost ($)',
        no_title: 'Untitled',
        updated_at: 'Updated at',
        sessions_count: 'sessions',
        of: 'of',
        lang_label: '中文',
        db_path: 'DB Path:',
        apply: 'Apply',
        db_ok: 'Connected',
        db_err: 'Error',
        db_default: 'Default',
      },
      zh: {
        subtitle: '查看 Devin CLI 所有会话的 token 使用量，支持按时间范围筛选与多维度聚合',
        last_1d: '最近 1 天',
        last_7d: '最近 7 天',
        last_30d: '最近 30 天',
        all_time: '全部',
        refresh: '\u27F3 刷新',
        sessions: '会话数',
        est_cost: '估算费用 (USD)',
        daily_trend: '按天趋势',
        hourly_trend: '按小时趋势',
        by_model: '按模型聚合',
        trend_line: '按天 Token 折线趋势',
        trend_line_hourly: '按小时 Token 折线趋势',
        pricing_title: '模型单价与费用估算',
        pricing_note: '（单位：USD / 1M tokens，价格为 2026-08-20 官方公开定价）',
        model: '模型',
        input_price: 'Input 单价',
        cached_price: 'Cached 单价',
        output_price: 'Output 单价',
        total: '合计',
        session_detail: '会话明细',
        all_models: '全部模型',
        last_activity: '最后活动',
        title: '标题',
        cache_rate: '缓存率',
        cost_usd: '费用 ($)',
        no_title: '无标题',
        updated_at: '更新于',
        sessions_count: '个会话',
        of: '/',
        lang_label: 'EN',
        db_path: '数据库路径：',
        apply: '应用',
        db_ok: '已连接',
        db_err: '错误',
        db_default: '默认',
      },
    };

    let lang = localStorage.getItem('devin-usage-lang') || 'en';
    const t = key => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;

    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        el.innerHTML = t(el.dataset.i18nHtml);
      });
      document.getElementById('subtitle').textContent = t('subtitle');
      document.getElementById('lang-btn').textContent = t('lang_label');
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      // Re-render dynamic content
      renderTable();
      renderPricingTable(lastModelData);
      if (lastDayData) {
        renderChartDay(lastDayData);
        renderChartTrend(lastDayData);
      }
      if (lastModelData) renderChartModel(lastModelData);
      updateFilterCount();
    }

    // ---- State ----
    let currentDays = 7;
    let allSessions = [];
    let sortKey = 'last_activity_at_str';
    let sortDir = 'desc';
    let chartDay = null, chartModel = null, chartTrend = null;
    let modelFilter = '';
    let lastModelData = [];
    let lastDayData = [];
    const DEFAULT_DB = '~/.local/share/devin/cli/sessions.db';
    let dbPath = localStorage.getItem('devin-usage-db') || '';

    const fmt = n => {
      if (n === 0 || n === null) return '0';
      if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
      return n.toLocaleString();
    };

    // ---- Data loading ----
    async function loadAll() {
      const parts = [];
      if (currentDays !== '') parts.push(`days=${currentDays}`);
      if (dbPath) parts.push(`db=${encodeURIComponent(dbPath)}`);
      const params = parts.length ? '?' + parts.join('&') : '';
      const [sessRes, modelRes, dayRes] = await Promise.all([
        fetch('/api/sessions' + params),
        fetch('/api/by-model' + params),
        fetch('/api/by-day' + params),
      ]);
      // Handle error responses
      if (!sessRes.ok) {
        const err = await sessRes.json().catch(() => ({}));
        document.getElementById('db-status').textContent = t('db_err') + ': ' + (err.error || sessRes.statusText);
        document.getElementById('db-status').style.color = 'var(--red)';
        return;
      }
      document.getElementById('db-status').textContent = t('db_ok');
      document.getElementById('db-status').style.color = 'var(--green)';
      const sessData = await sessRes.json();
      lastModelData = await modelRes.json();
      lastDayData = await dayRes.json();

      updateSummary(sessData.aggregate);
      allSessions = sessData.sessions;
      updateModelFilter(lastModelData);
      renderTable();
      renderChartDay(lastDayData);
      renderChartModel(lastModelData);
      renderChartTrend(lastDayData);
      renderPricingTable(lastModelData);

      const now = new Date();
      document.getElementById('last-updated').textContent = `${t('updated_at')} ${now.toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-US')}`;
    }

    function updateSummary(a) {
      document.getElementById('s-sessions').textContent = a.session_count;
      document.getElementById('s-messages').textContent = fmt(a.agent_messages);
      document.getElementById('s-input').textContent = fmt(a.input_tokens);
      document.getElementById('s-output').textContent = fmt(a.output_tokens);
      document.getElementById('s-cached').textContent = fmt(a.cached_input_tokens);
      document.getElementById('s-total').textContent = fmt(a.total_tokens);
      document.getElementById('s-cost').textContent = '$' + (a.estimated_cost || 0).toFixed(2);
    }

    // ---- Model filter ----
    function updateModelFilter(modelData) {
      const sel = document.getElementById('model-filter');
      const prev = modelFilter;
      sel.innerHTML = `<option value="">${t('all_models')}</option>`
        + modelData.map(m => `<option value="${m.model_group}">${m.model}</option>`).join('');
      if ([...sel.options].some(o => o.value === prev)) {
        sel.value = prev;
      } else {
        modelFilter = '';
      }
    }

    function updateFilterCount() {
      const filtered = modelFilter
        ? allSessions.filter(s => s.model_group === modelFilter)
        : allSessions;
      const el = document.getElementById('filter-count');
      if (modelFilter) {
        el.textContent = lang === 'zh'
          ? `（${filtered.length} / ${allSessions.length} ${t('sessions_count')}）`
          : `(${filtered.length} ${t('of')} ${allSessions.length} ${t('sessions_count')})`;
      } else {
        el.textContent = '';
      }
    }

    // ---- Table ----
    function renderTable() {
      const filtered = modelFilter
        ? allSessions.filter(s => s.model_group === modelFilter)
        : allSessions;
      updateFilterCount();
      const sorted = [...filtered].sort((a, b) => {
        let va = a[sortKey], vb = b[sortKey];
        if (typeof va === 'number' || typeof vb === 'number') {
          va = Number(va); vb = Number(vb);
          return sortDir === 'asc' ? va - vb : vb - va;
        }
        va = String(va); vb = String(vb);
        return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
      });
      const tbody = document.getElementById('session-tbody');
      tbody.innerHTML = sorted.map(s => {
        const totalInput = s.input_tokens + s.cached_input_tokens;
        const rate = totalInput > 0 ? (s.cached_input_tokens / totalInput * 100) : 0;
        s.cache_rate = rate;
        const rateColor = rate >= 80 ? '#3fb950' : rate >= 50 ? '#d29922' : '#f85149';
        return `
        <tr>
          <td>${s.last_activity_at_str}</td>
          <td class="title-cell" title="${s.title}"><a href="/session/${s.id}" style="color:var(--text);text-decoration:none">${s.title || '<span style="color:var(--text-dim)">' + t('no_title') + '</span>'}</a></td>
          <td><span class="model-badge">${s.model_display}</span></td>
          <td class="td-num">${s.input_tokens.toLocaleString()}</td>
          <td class="td-num">${s.output_tokens.toLocaleString()}</td>
          <td class="td-num">${s.cached_input_tokens.toLocaleString()}</td>
          <td class="td-num" style="color:${rateColor};font-weight:600">${rate.toFixed(1)}%</td>
          <td class="td-num" style="font-weight:600">${s.total_tokens.toLocaleString()}</td>
          <td class="td-num" style="color:#f0883e;font-weight:600">$${s.estimated_cost.toFixed(2)}</td>
          <td class="td-num">${s.agent_messages}</td>
        </tr>
      `}).join('');
      document.querySelectorAll('th[data-key]').forEach(th => {
        th.classList.remove('sorted-asc', 'sorted-desc');
        if (th.dataset.key === sortKey) {
          th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
        }
      });
    }

    // ---- Charts ----
    const chartColors = {
      input: '#58a6ff', output: '#3fb950', cached: '#d29922',
      palette: ['#58a6ff', '#3fb950', '#d29922', '#f85149', '#bc8cff', '#ff7b72', '#79c0ff', '#ffa657'],
    };

    function renderChartDay(data) {
      const ctx = document.getElementById('chart-day').getContext('2d');
      if (chartDay) chartDay.destroy();
      const hourly = data.length > 0 && data[0].date.includes(' ');
      const labels = data.map(d => hourly ? d.date.split(' ')[1] : d.date.slice(5));
      const titleEl = document.getElementById('chart-day').closest('.chart-card').querySelector('h3');
      titleEl.textContent = hourly ? t('hourly_trend') : t('daily_trend');
      chartDay = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Input', data: data.map(d => d.input_tokens), backgroundColor: chartColors.input },
            { label: 'Output', data: data.map(d => d.output_tokens), backgroundColor: chartColors.output },
            { label: 'Cached', data: data.map(d => d.cached_input_tokens), backgroundColor: chartColors.cached },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { stacked: true, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
            y: { stacked: true, ticks: { color: '#8b949e', callback: v => fmt(v) }, grid: { color: '#21262d' } },
          },
          plugins: { legend: { labels: { color: '#e6edf3' } } },
        },
      });
    }

    function renderChartModel(data) {
      const ctx = document.getElementById('chart-model').getContext('2d');
      if (chartModel) chartModel.destroy();
      chartModel = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.map(d => d.model),
          datasets: [{
            data: data.map(d => d.estimated_cost),
            backgroundColor: data.map((_, i) => chartColors.palette[i % chartColors.palette.length]),
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { color: '#e6edf3', font: { size: 12 } } },
            tooltip: { callbacks: { label: ctx => `${ctx.label}: $${ctx.raw.toFixed(2)}` } },
          },
        },
      });
    }

    function renderChartTrend(data) {
      const ctx = document.getElementById('chart-trend').getContext('2d');
      if (chartTrend) chartTrend.destroy();
      const hourly = data.length > 0 && data[0].date.includes(' ');
      const labels = data.map(d => hourly ? d.date.split(' ')[1] : d.date.slice(5));
      const titleEl = document.getElementById('chart-trend').closest('.chart-card').querySelector('h3');
      titleEl.textContent = hourly ? t('trend_line_hourly') : t('trend_line');
      const mkLine = (label, key, color) => ({
        label,
        data: data.map(d => d[key]),
        borderColor: color,
        backgroundColor: color + '20',
        fill: true,
        tension: 0.35,
        pointRadius: 3,
        pointHoverRadius: 5,
        borderWidth: 2,
      });
      chartTrend = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            mkLine('Input', 'input_tokens', chartColors.input),
            mkLine('Output', 'output_tokens', chartColors.output),
            mkLine('Cached', 'cached_input_tokens', chartColors.cached),
            mkLine('Total', 'total_tokens', '#bc8cff'),
            mkLine('Cost (USD)', 'estimated_cost', '#f0883e'),
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
            y: { ticks: { color: '#8b949e', callback: v => fmt(v) }, grid: { color: '#21262d' } },
          },
          plugins: {
            legend: { labels: { color: '#e6edf3', usePointStyle: true } },
            tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmt(ctx.raw)}` } },
          },
        },
      });
    }

    function renderPricingTable(data) {
      const tbody = document.getElementById('pricing-tbody');
      let totalCost = 0;
      tbody.innerHTML = data.map(d => {
        totalCost += d.estimated_cost;
        const p = d.pricing;
        const inputPrice = p ? `$${p.input.toFixed(2)}` : '<span style="color:var(--text-dim)">—</span>';
        const cachedPrice = p ? `$${p.cached.toFixed(3)}` : '<span style="color:var(--text-dim)">—</span>';
        const outputPrice = p ? `$${p.output.toFixed(2)}` : '<span style="color:var(--text-dim)">—</span>';
        return `
          <tr>
            <td><span class="model-badge">${d.model}</span></td>
            <td class="td-num">${inputPrice}</td>
            <td class="td-num">${cachedPrice}</td>
            <td class="td-num">${outputPrice}</td>
            <td class="td-num">${d.input_tokens.toLocaleString()}</td>
            <td class="td-num">${d.output_tokens.toLocaleString()}</td>
            <td class="td-num">${d.cached_input_tokens.toLocaleString()}</td>
            <td class="td-num">${d.session_count}</td>
            <td class="td-num" style="color:#f0883e;font-weight:600">$${d.estimated_cost.toFixed(2)}</td>
          </tr>
        `;
      }).join('');
      document.getElementById('pricing-total').textContent = '$' + totalCost.toFixed(2);
    }

    // ---- Event handlers ----
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDays = btn.dataset.days === '' ? '' : parseInt(btn.dataset.days);
        loadAll();
      });
    });

    document.getElementById('refresh-btn').addEventListener('click', loadAll);

    // ---- DB path ----
    const dbInput = document.getElementById('db-input');
    dbInput.value = dbPath || DEFAULT_DB;
    if (!dbPath) dbInput.placeholder = DEFAULT_DB;
    document.getElementById('db-status').textContent = dbPath ? '' : t('db_default');

    document.getElementById('db-apply').addEventListener('click', () => {
      const val = dbInput.value.trim();
      if (val === DEFAULT_DB || val === '') {
        dbPath = '';
        localStorage.removeItem('devin-usage-db');
      } else {
        dbPath = val;
        localStorage.setItem('devin-usage-db', val);
      }
      loadAll();
    });
    dbInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('db-apply').click();
    });

    document.getElementById('lang-btn').addEventListener('click', () => {
      lang = lang === 'en' ? 'zh' : 'en';
      localStorage.setItem('devin-usage-lang', lang);
      applyLang();
      // Re-fetch to update the "updated at" timestamp locale
      loadAll();
    });

    document.getElementById('model-filter').addEventListener('change', e => {
      modelFilter = e.target.value;
      renderTable();
    });

    document.querySelectorAll('th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (sortKey === key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = key;
          sortDir = 'desc';
        }
        renderTable();
      });
    });

    // ---- Init ----
    applyLang();
    loadAll();
  </script>
</body>
</html>
