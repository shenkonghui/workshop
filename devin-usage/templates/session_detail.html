<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Detail — Devin Usage</title>
  <style>
    :root {
      --bg: #0d1117; --card: #161b22; --border: #30363d;
      --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
      --green: #3fb950; --orange: #d29922; --red: #f85149;
      --user-bg: #1a2332; --assistant-bg: #161b22; --system-bg: #1c1e24;
      --tool-bg: #181c14; --tool-call-bg: #1b1e2a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); padding: 24px;
    }
    .header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .header h1 { font-size: 20px; }
    .header a { color: var(--accent); text-decoration: none; font-size: 14px; }
    .header a:hover { text-decoration: underline; }
    .header .lang-btn {
      margin-left: auto; padding: 4px 14px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--card); color: var(--text);
      cursor: pointer; font-size: 13px;
    }
    .header .lang-btn:hover { border-color: var(--accent); color: var(--accent); }

    .session-meta {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; margin-bottom: 20px; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
    }
    .meta-item .label { color: var(--text-dim); font-size: 11px; margin-bottom: 2px; }
    .meta-item .value { font-size: 14px; font-weight: 500; }

    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn {
      padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text-dim); cursor: pointer;
      font-size: 13px; transition: all .15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    #search-input {
      flex: 1; min-width: 200px; padding: 5px 10px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--card); color: var(--text); font-size: 13px;
    }
    #search-input:focus { outline: none; border-color: var(--accent); }
    .msg-count { color: var(--text-dim); font-size: 12px; }

    .messages { max-width: 100%; }
    .msg {
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
      overflow: hidden;
    }
    .msg-header {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      cursor: pointer; user-select: none; font-size: 12px;
    }
    .msg-header:hover { background: rgba(88,166,255,.05); }
    .msg-role {
      font-weight: 600; text-transform: uppercase; font-size: 11px;
      padding: 2px 8px; border-radius: 4px;
    }
    .msg-role.user { background: rgba(88,166,255,.15); color: var(--accent); }
    .msg-role.assistant { background: rgba(63,185,80,.15); color: var(--green); }
    .msg-role.system { background: rgba(139,148,158,.15); color: var(--text-dim); }
    .msg-role.tool { background: rgba(210,153,34,.15); color: var(--orange); }
    .msg-time { color: var(--text-dim); }
    .msg-size { color: var(--text-dim); margin-left: auto; }
    .msg-toggle { color: var(--text-dim); font-size: 14px; }
    .msg-body { padding: 0 12px 12px; display: none; }
    .msg.expanded .msg-body { display: block; }
    .msg.expanded .msg-toggle::before { content: '\25BC'; }
    .msg-toggle::before { content: '\25B6'; }

    .msg-content {
      white-space: pre-wrap; word-break: break-word; font-size: 13px;
      line-height: 1.6; max-height: 600px; overflow-y: auto;
      padding: 8px; border-radius: 4px; margin-bottom: 8px;
    }
    .msg.user .msg-content { background: var(--user-bg); }
    .msg.assistant .msg-content { background: var(--assistant-bg); }
    .msg.system .msg-content { background: var(--system-bg); color: var(--text-dim); font-size: 12px; }
    .msg.tool .msg-content { background: var(--tool-bg); font-family: monospace; font-size: 12px; }

    .tool-call {
      background: var(--tool-call-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px;
    }
    .tool-call-name {
      color: var(--accent); font-weight: 600; margin-bottom: 4px;
    }
    .tool-call-args {
      font-family: monospace; white-space: pre-wrap; word-break: break-word;
      color: var(--text); max-height: 300px; overflow-y: auto;
    }

    .loading { text-align: center; padding: 60px; color: var(--text-dim); }
    .error { text-align: center; padding: 60px; color: var(--red); }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">&larr; <span data-i18n="back"></span></a>
    <h1 id="session-title">Loading...</h1>
    <button class="lang-btn" id="lang-btn">中文</button>
  </div>

  <div class="session-meta" id="session-meta"></div>

  <div class="toolbar">
    <button class="filter-btn active" data-filter="all" data-i18n="all"></button>
    <button class="filter-btn" data-filter="user" data-i18n="user"></button>
    <button class="filter-btn" data-filter="assistant" data-i18n="assistant"></button>
    <button class="filter-btn" data-filter="tool" data-i18n="tool"></button>
    <button class="filter-btn" data-filter="system" data-i18n="system"></button>
    <input id="search-input" type="text" data-i18n-ph="search_ph" />
    <span class="msg-count" id="msg-count"></span>
  </div>

  <div class="messages" id="messages">
    <div class="loading">Loading...</div>
  </div>

  <script>
    const I18N = {
      en: {
        back: 'Back to Dashboard',
        all: 'All',
        user: 'User',
        assistant: 'Assistant',
        tool: 'Tool',
        system: 'System',
        search_ph: 'Search messages...',
        msgs: 'messages',
        created: 'Created',
        last_activity: 'Last Activity',
        model: 'Model',
        workdir: 'Working Directory',
        tokens: 'Tokens',
        messages: 'Messages',
        tool_call: 'Tool Call',
        collapsed: 'System messages are collapsed by default. Click to expand.',
        lang_label: '中文',
      },
      zh: {
        back: '返回仪表盘',
        all: '全部',
        user: '用户',
        assistant: '助手',
        tool: '工具',
        system: '系统',
        search_ph: '搜索消息...',
        msgs: '条消息',
        created: '创建时间',
        last_activity: '最后活动',
        model: '模型',
        workdir: '工作目录',
        tokens: 'Tokens',
        messages: '消息数',
        tool_call: '工具调用',
        collapsed: '系统消息默认折叠，点击展开。',
        lang_label: 'EN',
      },
    };

    let lang = localStorage.getItem('devin-usage-lang') || 'en';
    const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
    const sessionId = '{{ session_id }}';
    let allMessages = [];
    let roleFilter = 'all';
    let searchTerm = '';
    let dbPath = localStorage.getItem('devin-usage-db') || '';

    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
      document.getElementById('search-input').placeholder = t('search_ph');
      document.getElementById('lang-btn').textContent = t('lang_label');
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      renderMessages();
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function fmtBytes(n) {
      if (n >= 1e6) return (n/1e6).toFixed(1) + 'MB';
      if (n >= 1e3) return (n/1e3).toFixed(1) + 'KB';
      return n + 'B';
    }

    async function loadSession() {
      const params = dbPath ? `?db=${encodeURIComponent(dbPath)}` : '';
      const res = await fetch(`/api/session/${sessionId}${params}`);
      if (!res.ok) {
        document.getElementById('messages').innerHTML = '<div class="error">Failed to load session</div>';
        return;
      }
      const data = await res.json();
      const s = data.session;
      allMessages = data.messages;

      document.getElementById('session-title').textContent = s.title || s.id;

      const meta = document.getElementById('session-meta');
      meta.innerHTML = [
        ['model', s.model_display],
        ['created', s.created_at_str],
        ['last_activity', s.last_activity_at_str],
        ['workdir', s.working_directory],
        ['tokens', s.total_tokens.toLocaleString()],
        ['messages', allMessages.length],
      ].map(([k, v]) => `
        <div class="meta-item">
          <div class="label">${t(k)}</div>
          <div class="value">${escapeHtml(String(v))}</div>
        </div>
      `).join('');

      renderMessages();
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      const filtered = allMessages.filter(m => {
        if (roleFilter !== 'all' && m.role !== roleFilter) return false;
        if (searchTerm) {
          const text = (m.content || '') + JSON.stringify(m.tool_calls || []);
          if (!text.toLowerCase().includes(searchTerm.toLowerCase())) return false;
        }
        return true;
      });

      document.getElementById('msg-count').textContent = `${filtered.length} / ${allMessages.length} ${t('msgs')}`;

      if (filtered.length === 0) {
        container.innerHTML = '<div class="loading">No messages match the filter.</div>';
        return;
      }

      container.innerHTML = filtered.map(m => {
        const isSystem = m.role === 'system';
        const expanded = !isSystem;
        const content = m.content || '';
        const toolCallsHtml = (m.tool_calls || []).map(tc => {
          let argsStr;
          try {
            argsStr = typeof tc.arguments === 'string'
              ? JSON.stringify(JSON.parse(tc.arguments), null, 2)
              : JSON.stringify(tc.arguments, null, 2);
          } catch { argsStr = String(tc.arguments); }
          return `
            <div class="tool-call">
              <div class="tool-call-name">${escapeHtml(tc.name || 'unknown')}</div>
              <div class="tool-call-args">${escapeHtml(argsStr)}</div>
            </div>
          `;
        }).join('');

        const contentHtml = content
          ? `<div class="msg-content">${escapeHtml(content)}</div>`
          : '';

        return `
          <div class="msg ${m.role} ${expanded ? 'expanded' : ''}" data-node="${m.node_id}">
            <div class="msg-header" onclick="this.parentElement.classList.toggle('expanded')">
              <span class="msg-role ${m.role}">${m.role}</span>
              <span class="msg-time">${m.created_at_str}</span>
              <span class="msg-size">${fmtBytes(m.msg_size)}</span>
              <span class="msg-toggle"></span>
            </div>
            <div class="msg-body">
              ${contentHtml}
              ${toolCallsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    // Event handlers
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        roleFilter = btn.dataset.filter;
        renderMessages();
      });
    });

    document.getElementById('search-input').addEventListener('input', e => {
      searchTerm = e.target.value;
      renderMessages();
    });

    document.getElementById('lang-btn').addEventListener('click', () => {
      lang = lang === 'en' ? 'zh' : 'en';
      localStorage.setItem('devin-usage-lang', lang);
      applyLang();
    });

    applyLang();
    loadSession();
  </script>
</body>
</html>
